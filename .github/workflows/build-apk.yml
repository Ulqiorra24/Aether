name: Build and Release APK

on:
  push:
    branches: [ "main", "test" ]

permissions:
  contents: write

concurrency:
  group: aether-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select next release version
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        version="0.1"
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          latest=$(gh api "repos/$GH_REPO/releases" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')
          if [[ -z "$latest" ]]; then
            version="0.1"
          elif [[ "$latest" =~ ^v0\.([0-9]+)$ ]]; then
            minor=${BASH_REMATCH[1]}
            version="0.$((10#$minor + 1))"
          else
            printf 'Unsupported latest release version: %s\n' "$latest" >&2
            exit 1
          fi
        fi
        minor=${version#0.}
        printf 'name=%s\ncode=%s\n' "$version" "$((minor + 3))" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Restore signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-release.jks"
        chmod 600 "$RUNNER_TEMP/aether-release.jks"

    - name: Build APK
      env:
        AETHER_KEYSTORE_PATH: ${{ runner.temp }}/aether-release.jks
        AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleRelease -PaetherVersionName=${{ steps.version.outputs.name }} -PaetherVersionCode=${{ steps.version.outputs.code }}
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aether.apk

    - name: Remove signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/aether-release.jks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aether-${{ steps.version.outputs.name }}-apk
        path: app/build/outputs/apk/release/aether.apk

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_VERSION: ${{ steps.version.outputs.name }}
      run: |
        gh release create "v$RELEASE_VERSION" app/build/outputs/apk/release/aether.apk \
          --target "${{ github.sha }}" \
          --title "Aether v$RELEASE_VERSION" \
          --notes "### Что нового в v$RELEASE_VERSION:

        🛠️ **Исправление обфускатора адресов**:
        - Устранена ошибка 'no protocol' при авторизации.
        - Добавлен юнит-тест проверки раскодирования адреса сервера.

        🔐 **Авторизация и Личный кабинет**:
        - Вход по Email и Паролю.
        - Регистрация с автоматическим созданием клиента 3X-UI.
        - Активация существующих подписок (Email + Sub ID + назначение пароля).

        🔀 **Улучшенная Маршрутизация**:
        - Исключение локальной сети (LAN).
        - Исключение российских сайтов (.ru, .рф, .su, госресурсов) и IP-адресов РФ.

        📊 **Логи трафика**:
        - Просмотр соединений (TCP/UDP, DIRECT/PROXY) с функцией копирования и очистки." \
          --latest
