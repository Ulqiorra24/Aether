name: Build and Release APK

on:
  push:
    branches: [ "main", "test" ]

permissions:
  contents: write

concurrency:
  group: aether-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select release version from gradle.properties
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version_name=$(grep '^aetherVersionName=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
        version_code=$(grep '^aetherVersionCode=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
        if [[ -z "$version_name" || -z "$version_code" ]]; then
          echo "Error: version name or code missing in gradle.properties" >&2
          exit 1
        fi
        printf 'name=%s\ncode=%s\n' "$version_name" "$version_code" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Restore signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-release.jks"
        chmod 600 "$RUNNER_TEMP/aether-release.jks"

    - name: Build APK
      env:
        AETHER_KEYSTORE_PATH: ${{ runner.temp }}/aether-release.jks
        AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleRelease -PaetherVersionName=${{ steps.version.outputs.name }} -PaetherVersionCode=${{ steps.version.outputs.code }}
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aether.apk

    - name: Remove signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/aether-release.jks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aether-${{ steps.version.outputs.name }}-apk
        path: app/build/outputs/apk/release/aether.apk

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_VERSION: ${{ steps.version.outputs.name }}
      run: |
        if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
          gh release upload "v$RELEASE_VERSION" app/build/outputs/apk/release/aether.apk --clobber
        else
          gh release create "v$RELEASE_VERSION" app/build/outputs/apk/release/aether.apk \
            --target "${{ github.sha }}" \
            --title "Aether v$RELEASE_VERSION" \
            --notes "### Что нового в v$RELEASE_VERSION:

          🔄 **Оптимизация формы регистрации**:
          - Поля «Пароль» и «Повторите пароль» теперь идут последовательно друг за другом, а «Email для оплаты (необязательно)» расположен ниже.
          - Добавлена кнопка показа/скрытия пароля (иконка глаза) для обоих полей ввода пароля.

          ⌨️ **Адаптация экранов авторизации под клавиатуру (IME)**:
          - Добавлен \`imePadding()\` и плавная вертикальная прокрутка (\`verticalScroll\`) на всех вкладках («Вход», «Регистрация», «Активация»).
          - Клавиатура больше не перекрывает нижние поля и кнопку — экран свободно скроллится свайпом до самого низа.
          - Добавлен скроллинг в диалоге редактирования профиля при открытой клавиатуре.

          🧹 **Очистка профиля от тестовых аккаунтов**:
          - Полностью исключены и очищены остаточные данные тестового аккаунта (\`qg9xa3obc1ban6o5\` и \`test\`).
          - Добавлена автоочистка устаревших ключей SharedPreferences при старте приложения и полный сброс сессии при выходе (\`clearAuth()\`).

          💳 **Индикация и надежность оплаты**:
          - Прямая генерация СБП ссылок через Lava.top API и автопродление в 3X-UI.
          - Промокоды на скидку, индикация создания счета и защита от двойного продления.
          - Поддержка отдельного Email для оплаты и быстрое копирование в 1 клик." \
            --latest
        fi
