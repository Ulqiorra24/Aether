name: Build and Release APK

on:
  push:
    branches: [ "main", "test" ]

permissions:
  contents: write

concurrency:
  group: aether-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select release version from gradle.properties
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version_name=$(grep '^aetherVersionName=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
        version_code=$(grep '^aetherVersionCode=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
        if [[ -z "$version_name" || -z "$version_code" ]]; then
          echo "Error: version name or code missing in gradle.properties" >&2
          exit 1
        fi
        printf 'name=%s\ncode=%s\n' "$version_name" "$version_code" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Restore signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-release.jks"
        chmod 600 "$RUNNER_TEMP/aether-release.jks"

    - name: Build APK
      env:
        AETHER_KEYSTORE_PATH: ${{ runner.temp }}/aether-release.jks
        AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleRelease -PaetherVersionName=${{ steps.version.outputs.name }} -PaetherVersionCode=${{ steps.version.outputs.code }}
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aether.apk

    - name: Remove signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/aether-release.jks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aether-${{ steps.version.outputs.name }}-apk
        path: app/build/outputs/apk/release/aether.apk

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_VERSION: ${{ steps.version.outputs.name }}
      run: |
        if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
          gh release upload "v$RELEASE_VERSION" app/build/outputs/apk/release/aether.apk --clobber
        else
          gh release create "v$RELEASE_VERSION" app/build/outputs/apk/release/aether.apk \
            --target "${{ github.sha }}" \
            --title "Aether v$RELEASE_VERSION" \
            --notes "### Что нового в v$RELEASE_VERSION:

          📲 **Улучшенный диалог обновления приложения**:
          - Индикатор и проценты загрузки APK вынесены наверх и всегда видны сразу после нажатия кнопки.
          - Описание изменений (release notes) помещено в отдельный скроллируемый блок и не вытесняет полосу прогресса.

          ⌨️ **Адаптация диалога оплаты под клавиатуру**:
          - Полноэкранный режим диалога (`skipPartiallyExpanded`) и поддержка вертикальной прокрутки.
          - Добавлен `imePadding` и автоматический скролл к полю ввода при открытии клавиатуры.
          - В `AndroidManifest.xml` включен `adjustResize`.

          🎁 **Промокоды и Повторная оплата**:
          - Ввод промокода в диалоге продления подписки (скидки Lava.top).
          - Устранена ошибка «Данный продукт уже приобретен» при повторном продлении через Lava.top.
          - Валидация промокода бэкендом с понятным отображением ошибки.

          ✉️ **Email для оплаты и Редактирование профиля**:
          - Ввод Email для оплаты при регистрации аккаунта.
          - Отображение Email для оплаты в Профиле с возможностью быстрого копирования в 1 клик.
          - Редактирование профиля (иконка Карандаша) для изменения пароля и Email для оплаты.

          💳 **Интеграция с Lava.top**:
          - Оплата продления подписки картами РФ, СБП, СберПэй, Т-Пэй.
          - Автоматическое продление срока действия в 3X-UI через Webhook." \
            --latest
        fi
